<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Leaderboard - BookMyPlay

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --primary:#00ffc8;
    --secondary:#00e676;

    --bg:
    radial-gradient(circle at top left,
    #16213e,
    #0f172a 45%,
    #020617 90%);

    --glass:
    rgba(255,255,255,0.08);

    --text:white;
}

body{

    font-family:'Segoe UI',sans-serif;

    background:var(--bg);

    color:var(--text);

    overflow-x:hidden;
}

/* HEADER */

.header{

    padding:30px 20px;

    text-align:center;

    background:
    linear-gradient(135deg,
    #00c853,
    #00e676);

    border-bottom-left-radius:30px;
    border-bottom-right-radius:30px;

    box-shadow:
    0 0 30px rgba(0,255,180,0.35);
}

.header h2{
    font-size:38px;
}

.header p{
    margin-top:10px;
    opacity:0.9;
}

/* CONTAINER */

.container{

    width:92%;
    max-width:1100px;

    margin:auto;

    padding:25px 0 120px;
}

/* TOP 3 */

.top-three{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:20px;

    margin-bottom:35px;
}

/* PODIUM CARD */

.podium{

    background:var(--glass);

    backdrop-filter:blur(15px);

    border-radius:28px;

    padding:25px;

    text-align:center;

    box-shadow:
    0 0 30px rgba(0,0,0,0.2);

    border:
    1px solid rgba(255,255,255,0.08);

    transition:0.3s;
}

.podium:hover{
    transform:translateY(-6px);
}

.rank{

    font-size:55px;
}

.avatar{

    width:90px;
    height:90px;

    border-radius:50%;

    background:
    linear-gradient(135deg,
    var(--primary),
    var(--secondary));

    margin:15px auto;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:38px;

    color:black;

    font-weight:bold;
}

.name{

    font-size:22px;

    margin-bottom:10px;
}

.xp{

    color:var(--primary);

    font-size:20px;

    font-weight:bold;
}

.badge{

    margin-top:12px;

    display:inline-block;

    padding:8px 16px;

    border-radius:20px;

    background:
    rgba(255,255,255,0.1);

    font-size:13px;
}

/* LIST */

.list{

    background:var(--glass);

    backdrop-filter:blur(15px);

    border-radius:28px;

    padding:22px;

    box-shadow:
    0 0 30px rgba(0,0,0,0.2);

    border:
    1px solid rgba(255,255,255,0.08);
}

.player{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:18px;

    border-radius:18px;

    margin-bottom:14px;

    background:
    rgba(255,255,255,0.05);

    transition:0.3s;
}

.player:hover{
    transform:translateX(4px);
}

.left{

    display:flex;

    align-items:center;

    gap:15px;
}

.number{

    width:45px;
    height:45px;

    border-radius:50%;

    background:
    linear-gradient(135deg,
    var(--primary),
    var(--secondary));

    display:flex;
    justify-content:center;
    align-items:center;

    color:black;

    font-weight:bold;
}

.player-name{
    font-size:18px;
}

.points{

    color:var(--primary);

    font-weight:bold;
}

/* NAV */

.bottom-nav{

    position:fixed;

    bottom:15px;

    left:50%;

    transform:translateX(-50%);

    width:95%;
    max-width:700px;

    height:75px;

    border-radius:25px;

    background:
    rgba(15,20,35,0.92);

    backdrop-filter:blur(18px);

    display:flex;

    justify-content:space-around;
    align-items:center;

    box-shadow:
    0 0 30px rgba(0,255,200,0.15);

    z-index:999;
}

.bottom-nav div{

    text-align:center;

    cursor:pointer;

    transition:0.3s;

    font-size:14px;
}

.bottom-nav div:hover{
    color:var(--primary);
}

.active-nav{
    color:var(--primary);
}

/* MOBILE */

@media(max-width:768px){

    .header h2{
        font-size:30px;
    }

    .podium{
        padding:20px;
    }
}

@media(max-width:480px){

    .header{
        padding:25px 15px;
    }

    .header h2{
        font-size:24px;
    }

    .player{
        flex-direction:column;
        gap:12px;
        align-items:flex-start;
    }

    .bottom-nav div{
        font-size:11px;
    }
}

</style>
