<!DOCTYPE html>
<html>
<head>
    <title>Booking Success</title>
    <style>
        body{
            margin:0;
            font-family:'Segoe UI';
            background:#eef1f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:40px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
        }

        h2{
            color:#4CAF50;
        }

        button{
            margin:10px;
            padding:12px 20px;
            border:none;
            border-radius:10px;
            background:#4CAF50;
            color:white;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#45a049;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>🎉 Booking Successful!</h2>

    <div id="details" style="margin-top:15px;"></div>

    <button onclick="goHome()">🏠 Go Home</button>
    <button onclick="viewHistory()">📊 View Bookings</button>
</div>

<script>
function goHome(){
    window.location.href = "/dashboard";
}

function viewHistory(){
    window.location.href = "/history";
}

// 🔥 SHOW LAST BOOKING
let bookings = JSON.parse(localStorage.getItem("bookings")) || [];

let last = bookings[bookings.length - 1];

if(last){
    document.getElementById("details").innerHTML = `
        <b>Venue:</b> ${last.venue}<br>
        <b>Game:</b> ${last.game}<br>
        <b>Time:</b> ${last.time}<br>
        <b>Price:</b> ${last.price}<br>
        <b>Date:</b> ${last.date}
    `;
}
</script>

</body>
</html>
