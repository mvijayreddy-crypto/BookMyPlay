<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Login - BookMyPlay</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Segoe UI',sans-serif;
            width:100%;
            min-height:100vh;
            display:flex;
            overflow-x:hidden;
            background:#f5f5f5;
        }

        /* ================= LEFT IMAGE ================= */

        .left{
            width:50%;
            height:100vh;
            background:url("/static/sports-bg.jpg")
            no-repeat center center;
            background-size:cover;
        }

        /* ================= RIGHT LOGIN ================= */

        .right{
            width:50%;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f5f5f5;
            padding:20px;
        }

        /* ================= CARD ================= */

        .card{
            width:100%;
            max-width:420px;
            background:white;
            padding:30px;
            border-radius:24px;
            box-shadow:0 0 25px rgba(0,0,0,0.08);
        }

        h2{
            text-align:center;
            font-size:42px;
            margin-bottom:25px;
            font-weight:700;
        }

        /* ================= TOGGLE ================= */

        .toggle{
            display:flex;
            margin-bottom:22px;
            overflow:hidden;
            border-radius:10px;
        }

        .toggle button{
            flex:1;
            padding:12px;
            border:none;
            background:#eeeeee;
            cursor:pointer;
            font-size:15px;
        }

        .active{
            background:#4CAF50;
            color:white;
        }

        /* ================= INPUT ================= */

        .input-group{
            position:relative;
            margin-bottom:18px;
        }

        .input-group input{
            width:100%;
            padding:14px;
            padding-right:48px;
            border:1px solid #cccccc;
            border-radius:10px;
            outline:none;
            font-size:16px;
            background:white;
        }

        .input-group label{
            position:absolute;
            left:14px;
            top:14px;
            color:gray;
            transition:0.3s;
            pointer-events:none;
            background:white;
        }

        .input-group input:focus + label,
        .input-group input:valid + label{

            top:-8px;
            left:10px;
            font-size:12px;
            color:#4CAF50;
            padding:0 5px;
        }

        /* ================= EYE ICON ================= */

        .eye-icon{
            position:absolute;
            right:14px;
            top:14px;
            cursor:pointer;
            font-size:18px;
        }

        /* ================= BUTTON ================= */

        .btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            color:white;
            font-size:16px;
            transition:0.3s;
        }

        .btn:hover{
            transform:scale(1.02);
        }

        .login-btn{
            background:#4CAF50;
        }

        .google-btn{
            background:#4285F4;
        }

        .apple-btn{
            background:black;
        }

        .hidden{
            display:none;
        }

        .forgot{
            text-align:right;
            margin-bottom:15px;
        }

        .forgot a{
            color:#4CAF50;
            text-decoration:none;
            font-size:14px;
        }

        .error{
            color:red;
            text-align:center;
            margin-bottom:12px;
        }

        #strengthMessage{
            font-size:13px;
            margin-top:-10px;
            margin-bottom:12px;
            display:block;
        }

        /* ================= TABLET ================= */

        @media screen and (max-width:900px){

            .left{
                width:48%;
            }

            .right{
                width:52%;
                padding:15px;
            }

            .card{
                max-width:360px;
                padding:24px;
            }

            h2{
                font-size:36px;
            }
        }

        /* ================= FINAL MOBILE ================= */

        @media screen and (max-width:768px){

            body{
                flex-direction:column;
                overflow-y:auto;
                background:#f5f5f5;
            }

            /* TOP IMAGE */

            .left{
                width:100%;
                height:26vh;
                min-height:180px;
                background-position:center top;
                background-size:cover;
            }

            /* LOGIN SECTION */

            .right{
                width:100%;
                display:block;
                padding:0;
                background:#f5f5f5;
            }

            /* CARD */

            .card{
                width:100%;
                max-width:100%;
                border-radius:26px 26px 0 0;
                margin-top:-22px;
                padding:20px 16px 30px;
                box-shadow:none;
            }

            h2{
                font-size:28px;
                margin-bottom:16px;
            }

            .toggle{
                margin-bottom:16px;
            }

            .toggle button{
                padding:10px;
                font-size:13px;
            }

            .input-group{
                margin-bottom:14px;
            }

            .input-group input{
                font-size:14px;
                padding:12px;
                padding-right:40px;
            }

            .btn{
                padding:12px;
                font-size:14px;
            }

            .forgot{
                margin-bottom:12px;
            }

            .forgot a{
                font-size:12px;
            }

            .eye-icon{
                top:12px;
                font-size:16px;
            }

            center{
                font-size:15px;
            }
        }

    </style>

</head>

<body>

    <!-- LEFT IMAGE -->

    <div class="left"></div>

    <!-- RIGHT LOGIN -->

    <div class="right">

        <div class="card">

            <h2>Welcome Back</h2>

            <!-- TOGGLE -->

            <div class="toggle">

                <button
                    id="loginBtn"
                    class="active"
                    onclick="showLogin()"
                >
                    Login
                </button>

                <button
                    id="signupBtn"
                    onclick="showSignup()"
                >
                    Sign Up
                </button>

            </div>

            <!-- ERROR -->

            {% if error %}
            <div class="error">
                {{ error }}
            </div>
            {% endif %}

            <!-- LOGIN FORM -->

            <form
                method="POST"
                action="/login"
                id="loginForm"
            >

                <div class="input-group">

                    <input
                        type="text"
                        name="email"
                        required
                    >

                    <label>Email or Phone</label>

                </div>

                <div class="input-group">

                    <input
                        type="password"
                        name="password"
                        id="loginPassword"
                        required
                    >

                    <label>Password</label>

                    <span
                        class="eye-icon"
                        onclick="toggleLoginPassword()"
                    >
                        👁️
                    </span>

                </div>

                <div class="forgot">

                    <a href="/forgot-password">
                        Forgot Password?
                    </a>

                </div>

                <button
                    type="submit"
                    class="btn login-btn"
                    id="loginSubmitBtn"
                >
                    Login
                </button>

            </form>

            <!-- SIGNUP FORM -->

            <form
                method="POST"
                action="/signup"
                id="signupForm"
                class="hidden"
            >

                <div class="input-group">

                    <input
                        type="email"
                        name="email"
                        required
                    >

                    <label>Email</label>

                </div>

                <div class="input-group">

                    <input
                        type="text"
                        name="phone"
                        required
                    >

                    <label>Phone</label>

                </div>

                <div class="input-group">

                    <input
                        type="password"
                        name="password"
                        id="signupPassword"
                        onkeyup="checkPasswordStrength()"
                        required
                    >

                    <label>Password</label>

                    <span
                        class="eye-icon"
                        onclick="toggleSignupPassword()"
                    >
                        👁️
                    </span>

                </div>

                <small id="strengthMessage"></small>

                <button
                    type="submit"
                    class="btn login-btn"
                    id="signupSubmitBtn"
                >
                    Sign Up
                </button>

            </form>

            <br>

            <center>OR</center>

            <br>

            <!-- OTP -->

            <a href="/otp-login">

                <button
                    type="button"
                    class="btn"
                    style="background:linear-gradient(135deg,#ff9800,#ff5722)"
                >
                    🔐 Login with OTP
                </button>

            </a>

            <br><br>

            <!-- GOOGLE -->

            <a href="/login/google">

                <button
                    type="button"
                    class="btn google-btn"
                >
                    Continue with Google
                </button>

            </a>

            <br><br>

            <!-- APPLE -->

            <button class="btn apple-btn">
                 Continue with Apple
            </button>

        </div>

    </div>

<script>

function showSignup(){

    document.getElementById("loginForm")
    .classList.add("hidden");

    document.getElementById("signupForm")
    .classList.remove("hidden");

    document.getElementById("signupBtn")
    .classList.add("active");

    document.getElementById("loginBtn")
    .classList.remove("active");
}

function showLogin(){

    document.getElementById("signupForm")
    .classList.add("hidden");

    document.getElementById("loginForm")
    .classList.remove("hidden");

    document.getElementById("loginBtn")
    .classList.add("active");

    document.getElementById("signupBtn")
    .classList.remove("active");
}

function checkPasswordStrength(){

    let password =
    document.getElementById("signupPassword").value;

    let message =
    document.getElementById("strengthMessage");

    if(password.length < 6){

        message.innerHTML =
        "🔴 Weak Password";

        message.style.color = "red";
    }

    else if(password.length < 10){

        message.innerHTML =
        "🟡 Medium Password";

        message.style.color = "orange";
    }

    else{

        message.innerHTML =
        "🟢 Strong Password";

        message.style.color = "green";
    }
}

function toggleLoginPassword(){

    const password =
    document.getElementById("loginPassword");

    password.type =
    password.type === "password"
    ? "text"
    : "password";
}

function toggleSignupPassword(){

    const password =
    document.getElementById("signupPassword");

    password.type =
    password.type === "password"
    ? "text"
    : "password";
}

document.getElementById("loginForm")
.addEventListener("submit", function(){

    const btn =
    document.getElementById("loginSubmitBtn");

    btn.innerHTML = "⏳ Loading...";
    btn.disabled = true;
});

document.getElementById("signupForm")
.addEventListener("submit", function(){

    const btn =
    document.getElementById("signupSubmitBtn");

    btn.innerHTML =
    "⏳ Creating Account...";

    btn.disabled = true;
});

</script>

</body>
</html>
