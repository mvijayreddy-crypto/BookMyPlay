<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Live Support Chat
</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Segoe UI',sans-serif;

    background:
    radial-gradient(circle at top left,
    #16213e,
    #0f172a 45%,
    #020617 90%);

    color:white;

    overflow:hidden;
}

/* HEADER */

.header{

    height:80px;

    background:
    rgba(255,255,255,0.06);

    backdrop-filter:blur(15px);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 20px;

    border-bottom:
    1px solid rgba(255,255,255,0.08);
}

.profile{

    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{

    width:52px;
    height:52px;

    border-radius:50%;

    background:
    linear-gradient(135deg,
    #00ffc8,
    #00e676);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:24px;

    color:black;

    font-weight:bold;
}

.status{

    font-size:13px;
    color:#00ff9d;
}

/* CHAT AREA */

.chat-area{

    height:calc(100vh - 160px);

    overflow-y:auto;

    padding:20px;
}

/* MESSAGE */

.message{

    max-width:75%;

    padding:14px 18px;

    border-radius:18px;

    margin-bottom:18px;

    position:relative;

    animation:fadeIn 0.3s ease;
}

.bot{

    background:
    rgba(255,255,255,0.08);

    border-top-left-radius:5px;
}

.user{

    background:
    linear-gradient(135deg,
    #00ffc8,
    #00e676);

    color:black;

    margin-left:auto;

    border-top-right-radius:5px;
}

.time{

    font-size:11px;

    opacity:0.7;

    margin-top:8px;
}

/* INPUT AREA */

.input-area{

    position:fixed;

    bottom:0;

    width:100%;

    height:80px;

    background:
    rgba(255,255,255,0.05);

    backdrop-filter:blur(15px);

    display:flex;

    align-items:center;

    padding:15px;

    gap:12px;

    border-top:
    1px solid rgba(255,255,255,0.08);
}

.input-area input{

    flex:1;

    height:50px;

    border:none;

    outline:none;

    border-radius:30px;

    padding:0 18px;

    background:
    rgba(255,255,255,0.08);

    color:white;

    font-size:15px;
}

.send-btn{

    width:55px;
    height:55px;

    border:none;

    border-radius:50%;

    background:
    linear-gradient(135deg,
    #00ffc8,
    #00e676);

    color:black;

    font-size:24px;

    cursor:pointer;

    transition:0.3s;
}

.send-btn:hover{
    transform:scale(1.08);
}

/* QUICK REPLIES */

.quick{

    display:flex;

    gap:10px;

    padding:12px 20px;

    overflow-x:auto;
}

.quick button{

    white-space:nowrap;

    border:none;

    padding:10px 16px;

    border-radius:20px;

    background:
    rgba(255,255,255,0.08);

    color:white;

    cursor:pointer;
}

/* ANIMATION */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* MOBILE */

@media(max-width:600px){

    .message{
        max-width:85%;
    }

    .header h3{
        font-size:16px;
    }

    .input-area{
        padding:10px;
    }

    .send-btn{
        width:50px;
        height:50px;
    }
}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

<div class="profile">

<div class="avatar">
🎧
</div>

<div>

<h3>
BookMyPlay Support
</h3>

<div class="status">
● Online
</div>

</div>

</div>

<div style="font-size:26px;">
💬
</div>

</div>

<!-- QUICK REPLIES -->

<div class="quick">

<button onclick="quickMsg('Booking issue')">
Booking issue
</button>

<button onclick="quickMsg('Refund status')">
Refund status
</button>

<button onclick="quickMsg('Ground availability')">
Ground availability
</button>

<button onclick="quickMsg('Payment failed')">
Payment failed
</button>

</div>

<!-- CHAT AREA -->

<div class="chat-area"
id="chatArea">

<div class="message bot">

Hello 👋

Welcome to BookMyPlay support.

How can we help you today?

<div class="time">
Now
</div>

</div>

</div>

<!-- INPUT -->

<div class="input-area">

<input
type="text"
id="msg"
placeholder="Type your message..."
onkeypress="enterSend(event)"
>

<button class="send-btn"
onclick="sendMessage()">

➤

</button>

</div>

<script>

function currentTime(){

    let now = new Date();

    return now.toLocaleTimeString([],{
        hour:'2-digit',
        minute:'2-digit'
    });
}

function sendMessage(){

    let input =
    document.getElementById("msg");

    let text =
    input.value.trim();

    if(text === ""){
        return;
    }

    let chat =
    document.getElementById("chatArea");

    // USER MESSAGE

    chat.innerHTML += `

    <div class="message user">

        ${text}

        <div class="time">
            ${currentTime()}
        </div>

    </div>
    `;

    chat.scrollTop =
    chat.scrollHeight;

    input.value = "";

    // AUTO BOT REPLY

    setTimeout(()=>{

        let reply =
        getReply(text);

        chat.innerHTML += `

        <div class="message bot">

            ${reply}

            <div class="time">
                ${currentTime()}
            </div>

        </div>
        `;

        chat.scrollTop =
        chat.scrollHeight;

    },800);
}

function getReply(msg){

    msg = msg.toLowerCase();

    if(msg.includes("refund")){

        return "Your refund request is under processing. It usually takes 3-5 working days.";
    }

    if(msg.includes("payment")){

        return "Please verify your payment method or try again after some time.";
    }

    if(msg.includes("booking")){

        return "We checked your booking successfully. Please share booking ID if issue continues.";
    }

    if(msg.includes("ground")){

        return "Ground availability updates every few minutes in real-time.";
    }

    return "Our support team will connect with you shortly.";
}

function quickMsg(text){

    document.getElementById("msg")
    .value = text;

    sendMessage();
}

function enterSend(e){

    if(e.key === "Enter"){
        sendMessage();
    }
}

</script>

</body>
</html>
