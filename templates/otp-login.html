<!DOCTYPE html>
<html>
<head>
    <title>Login with OTP</title>
</head>

<body style="margin:0; display:flex; height:100vh; font-family:sans-serif;">

<!-- LEFT IMAGE -->
<div style="flex:1;">
    <img src="/static/sports-bg.jpg" style="width:100%; height:100%; object-fit:cover;">
</div>

<!-- RIGHT CARD -->
<div style="flex:1; display:flex; justify-content:center; align-items:center; background:#f5f5f5;">

    <div style="
        width:350px;
        padding:30px;
        background:white;
        border-radius:12px;
        box-shadow:0 0 20px rgba(0,0,0,0.1);
    ">

        <h2 style="text-align:center;">📱 Login with OTP</h2>

        {% if error %}
        <p style="color:red; text-align:center;">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input type="text" name="phone" placeholder="Enter phone number" required
                style="width:100%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid #ccc;">

            <button type="submit" style="
                width:100%;
                padding:10px;
                background:green;
                color:white;
                border:none;
                border-radius:5px;
                font-size:16px;
            ">
                Send OTP
            </button>
        </form>

        <br>

        <p style="text-align:center;">
            <a href="/login">⬅ Back to Login</a>
        </p>

    </div>
</div>

</body>
</html>
