<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Venue Details - BookMyPlay</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    overflow-x:hidden;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:
    radial-gradient(circle at top left,#16213e,#0f172a 45%,#020617 90%);
    color:white;
    overflow-x:hidden;
    padding-bottom:110px;
}

/* HERO */

.hero{
    height:280px;
    background:
    linear-gradient(rgba(0,0,0,0.45),
    rgba(0,0,0,0.55)),
    url('/static/cricket.png');
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:flex-end;
    padding:30px;
    border-bottom-left-radius:28px;
    border-bottom-right-radius:28px;
    box-shadow:0 0 30px rgba(0,0,0,0.4);
}

.hero h2{
    font-size:38px;
}

/* CONTAINER */

.container{
    display:flex;
    gap:24px;
    padding:24px;
    align-items:flex-start;
}

.left{
    flex:2;
}

.right{
    width:320px;
}

/* GLASS CARD */

.glass{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(14px);
    border-radius:24px;
    box-shadow:0 0 25px rgba(0,0,0,0.25);
}

/* GAMES */

.games{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    margin-bottom:24px;
}

.card{
    width:220px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
}

.card-body{
    padding:16px;
}

.card h4{
    margin-bottom:8px;
    font-size:20px;
}

.card p{
    color:#cccccc;
    font-size:14px;
}

/* SECTION */

.section{
    margin-top:24px;
}

.section h3{
    margin-bottom:16px;
    color:#00ffc8;
}

/* DATE */

.date-box{
    padding:18px;
}

.date-box input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    outline:none;
    background:rgba(255,255,255,0.1);
    color:white;
    font-size:15px;
}

/* SLOTS */

#slots{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.slot{
    padding:12px 18px;
    border-radius:14px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.available{
    background:#00c853;
    color:white;
}

.booked{
    background:#555;
    color:#ccc;
    cursor:not-allowed;
}

.selected{
    background:#00ffc8 !important;
    color:black;
}

.slot:hover{
    transform:scale(1.05);
}

/* MAP */

.map{
    overflow:hidden;
    border-radius:22px;
}

iframe{
    width:100%;
    border:none;
}

/* NEARBY */

.nearby-card{
    padding:16px;
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* SUMMARY */

.summary{
    position:sticky;
    top:20px;
    padding:24px;
}

.summary h3{
    margin-bottom:18px;
}

.summary p{
    margin-bottom:14px;
    color:#dddddd;
}

.price{
    font-size:32px;
    color:#00ffc8;
    font-weight:bold;
}

.book-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:18px;
    background:
    linear-gradient(135deg,#00ffc8,#00e676);
    color:black;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.book-btn:hover{
    transform:scale(1.03);
}

/* REVIEWS */

.review{
    padding:18px;
    margin-bottom:16px;
}

.review h4{
    margin-bottom:8px;
}

/* MODAL */

.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-content{
    width:90%;
    max-width:380px;
    padding:24px;
}

.modal-content h3{
    margin-bottom:18px;
}

.modal-content input{
    width:100%;
    padding:13px;
    margin-bottom:12px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,0.1);
    color:white;
    outline:none;
}

.pay-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:14px;
    background:#00e676;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

/* RESPONSIVE */

@media screen and (max-width:992px){

    .container{
        flex-direction:column;
    }

    .right{
        width:100%;
    }

    .summary{
        position:relative;
        top:0;
    }
}

/* MOBILE */

@media screen and (max-width:768px){

    .hero{
        height:220px;
        padding:20px;
    }

    .hero h2{
        font-size:28px;
    }

    .container{
        padding:16px;
    }

    .games{
        justify-content:center;
    }

    .card{
        width:100%;
    }

    .card img{
        height:180px;
    }

    #slots{
        justify-content:center;
    }

    .slot{
        width:100%;
        text-align:center;
    }

    .summary{
        padding:20px;
    }

    .price{
        font-size:28px;
    }
}

/* SMALL MOBILE */

@media screen and (max-width:480px){

    .hero{
        height:190px;
    }

    .hero h2{
        font-size:22px;
    }

    .container{
        padding:12px;
    }

    .card-body{
        padding:14px;
    }

    .summary{
        padding:18px;
    }
}

</style>

</head>

<body>

<!-- HERO -->

<div class="hero">

<h2 id="venueTitle">
Venue
</h2>

</div>

<!-- CONTAINER -->

<div class="container">

<!-- LEFT -->

<div class="left">

<!-- GAMES -->

<div class="games"
id="gamesContainer">
</div>

<!-- DATE -->

<div class="section">

<h3>
📅 Select Date
</h3>

<div class="glass date-box">

<input
type="date"
id="date"
onchange="handleDate()">

</div>

</div>

<!-- SLOTS -->

<div class="section">

<h3>
⏰ Live Slots
</h3>

<div id="slots"></div>

</div>

<!-- MAP -->

<div class="section">

<h3>
📍 Location
</h3>

<div class="glass map">

<iframe
height="260"
src="https://maps.google.com/maps?q=hyderabad&output=embed">
</iframe>

</div>

</div>

<!-- NEARBY -->

<div class="section">

<h3>
🏟 Nearby Venues
</h3>

<div class="glass nearby-card">
<span>Gachibowli Turf</span>
<span>⭐4.7</span>
</div>

<div class="glass nearby-card">
<span>Indoor Arena</span>
<span>⭐4.3</span>
</div>

</div>

<!-- REVIEWS -->

<div class="section">

<h3>
⭐ Reviews
</h3>

<div class="glass review">

<h4>
Rahul
</h4>

<p>
Amazing turf and great lighting for night matches.
</p>

</div>

<div class="glass review">

<h4>
Kiran
</h4>

<p>
Very smooth booking experience and affordable pricing.
</p>

</div>

</div>

</div>

<!-- RIGHT -->

<div class="right">

<div class="glass summary">

<h3>
Your Booking
</h3>

<p id="game">
Game: -
</p>

<p id="time">
Time: -
</p>

<p class="price"
id="price">
₹0
</p>

<button
class="book-btn"
onclick="openPayment()">

Proceed to Pay

</button>

</div>

</div>

</div>

<!-- PAYMENT -->

<div class="modal"
id="paymentModal">

<div class="glass modal-content">

<h3>
Payment
</h3>

<input placeholder="Card Number">

<input placeholder="Expiry">

<input placeholder="CVV">

<button
class="pay-btn"
onclick="pay()">

Pay Now

</button>

</div>

</div>

<script>

/* DATA */

let gamesData = {

"LB Stadium":
["cricket","tennis"],

"Gachibowli Turf":
["football","cricket"],

"Indoor Arena":
["badminton"]

};

let prices = {

cricket:300,
football:500,
badminton:200,
tennis:400

};

let times = [

"06:00",
"07:00",
"08:00",
"09:00",
"10:00"

];

let venue =
localStorage.getItem("venueName");

document
.getElementById("venueTitle")
.innerText = venue;

let container =
document.getElementById("gamesContainer");

let selectedGame = "";
let selectedTime = "";

/* LOAD GAMES */

(gamesData[venue] || [])
.forEach(game=>{

let div =
document.createElement("div");

div.className =
"card glass";

div.innerHTML = `

<img src="/static/${game}.png">

<div class="card-body">

<h4>${game}</h4>

<p>
Professional sports arena
</p>

</div>

`;

div.onclick = ()=>{

selectedGame = game;

alert(
"Selected: " + game
);

};

container.appendChild(div);

});

/* DATE */

function handleDate(){

let date =
document.getElementById("date").value;

if(!selectedGame){

alert(
"Select game first"
);

return;
}

loadSlots(
selectedGame,
date
);
}

/* LOAD SLOTS */

function loadSlots(game,date){

fetch(
`/check-slots?game=${game}&date=${date}`
)

.then(res=>res.json())

.then(data=>{

let container =
document.getElementById("slots");

container.innerHTML = "";

times.forEach(time=>{

let div =
document.createElement("div");

div.innerText = time;

div.classList.add("slot");

if(data.booked.includes(time)){

div.classList.add("booked");

}else{

div.classList.add("available");

div.onclick =
()=> selectSlot(time,div);
}

container.appendChild(div);

});

});

}

/* SELECT SLOT */

function selectSlot(time,element){

selectedTime = time;

document
.querySelectorAll(".slot")
.forEach(s=>
s.classList.remove("selected")
);

element.classList.add("selected");

document
.getElementById("game")
.innerText =
"Game: " + selectedGame;

document
.getElementById("time")
.innerText =
"Time: " + time;

document
.getElementById("price")
.innerText =
"₹" + prices[selectedGame];

}

/* BOOK SLOT */

function bookSlot(){

let date =
document.getElementById("date").value;

fetch("/book-slot",{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

game:selectedGame,
date:date,
time:selectedTime

})

})

.then(res=>res.text())

.then(msg=>{

alert(msg);

handleDate();

});

}

/* PAYMENT */

function openPayment(){

if(!selectedGame || !selectedTime){

alert(
"Select slot first"
);

return;
}

document
.getElementById("paymentModal")
.style.display = "flex";

}

function pay(){

bookSlot();

alert(
"🎉 Payment Successful!"
);

document
.getElementById("paymentModal")
.style.display = "none";

window.location.href =
"/success";

}

/* AUTO DATE */

window.onload = function(){

let today =
new Date()
.toISOString()
.split('T')[0];

document
.getElementById("date")
.value = today;

};

</script>

</body>
</html>
