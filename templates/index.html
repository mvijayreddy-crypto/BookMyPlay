<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book My Play</title>

<style>

/* ===== RESET ===== */
body{
    margin:0;
    font-family:'Segoe UI', sans-serif;
    color:white;
    overflow-x:hidden;
}

/* ===== VIDEO ===== */
video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

/* ===== OVERLAY ===== */
.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.9));
    z-index:-1;
}

/* ===== NAVBAR ===== */
.navbar{
    position:fixed;
    top:0;
    width:100%;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    backdrop-filter:blur(10px);
    background:rgba(0,0,0,0.3);
}

.logo{
    font-size:20px;
    font-weight:bold;
    background:linear-gradient(90deg,#00f2ff,#ff00cc);
    -webkit-background-clip:text;
    color:transparent;
}

.nav-btn{
    padding:8px 18px;
    border-radius:20px;
    border:none;
    background:linear-gradient(45deg,#00f2ff,#ff00cc);
    color:white;
    cursor:pointer;
}

/* ===== MAIN ===== */
.container{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

/* TITLE */
h1{
    font-size:48px;
    background:linear-gradient(90deg,#00f2ff,#ff00cc);
    -webkit-background-clip:text;
    color:transparent;
    animation:fadeUp 1s ease;
}

p{
    font-size:18px;
    animation:fadeUp 1.5s ease;
}

/* BUTTON */
.btn{
    margin-top:20px;
    padding:14px 40px;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,#00f2ff,#ff00cc);
    color:white;
    cursor:pointer;
    transition:0.3s;
    animation:fadeUp 2s ease;
}

.btn:hover{
    transform:scale(1.1);
}

/* ===== FEATURES ===== */
.features{
    display:flex;
    gap:30px;
    margin-top:60px;
    flex-wrap:wrap;
    justify-content:center;
}

.feature{
    width:250px;
    padding:25px;
    border-radius:15px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    text-align:center;
    transition:0.3s;
    animation:fadeUp 2.5s ease;
}

.feature:hover{
    transform:translateY(-10px);
}

.feature h3{
    color:#00f2ff;
}

/* ===== FOOTER ===== */
.footer{
    text-align:center;
    padding:10px;
    font-size:14px;
    background:rgba(0,0,0,0.6);
}

/* ===== ANIMATION ===== */
@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){

    h1{
        font-size:32px;
    }

    .features{
        flex-direction:column;
        align-items:center;
    }

    .navbar{
        padding:10px 20px;
    }

    .nav-btn{
        padding:6px 12px;
        font-size:12px;
    }

}

</style>
</head>

<body>

<!-- VIDEO -->
<video autoplay muted loop playsinline>
    <source src="{{ url_for('static', filename='bg-video.mp4') }}" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">BookMyPlay</div>
    <button class="nav-btn" onclick="goLogin()">Login</button>
</div>

<!-- CONTENT -->
<div class="container">

    <h1>Play Smarter. Book Faster.</h1>
    <p>Discover premium sports venues near you</p>

    <button class="btn" onclick="goLogin()">Explore Now</button>

    <div class="features">

        <div class="feature">
            <h3>⚡ Instant Booking</h3>
            <p>Book your favorite sports venue in seconds.</p>
        </div>

        <div class="feature">
            <h3>📍 Smart Location</h3>
            <p>Find nearby venues easily.</p>
        </div>

        <div class="feature">
            <h3>💳 Secure Payments</h3>
            <p>Safe and fast transactions.</p>
        </div>

    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    © 2026 BookMyPlay | All Rights Reserved
</div>

<script>
function goLogin(){
    window.location.href="/login";
}
</script>

</body>
</html>
