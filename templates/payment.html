<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Payment - BookMyPlay</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:
radial-gradient(circle at top left,#16213e,#0f172a 45%,#020617 90%);
color:white;
min-height:100vh;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
padding:30px;
border-radius:24px;
box-shadow:0 0 25px rgba(0,0,0,0.3);
margin-top:40px;
}

h2{
margin-bottom:25px;
text-align:center;
}

.box{
margin-bottom:18px;
padding:16px;
border-radius:18px;
background:rgba(255,255,255,0.06);
}

label{
display:block;
margin-bottom:10px;
font-weight:bold;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
outline:none;
background:rgba(255,255,255,0.1);
color:white;
margin-bottom:14px;
}

.methods{
display:flex;
gap:12px;
margin-bottom:20px;
}

.methods button{
flex:1;
padding:14px;
border:none;
border-radius:14px;
cursor:pointer;
font-weight:bold;
background:#1e293b;
color:white;
}

.methods button.active{
background:#00e676;
color:black;
}

.pay-btn{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:
linear-gradient(135deg,#00ffc8,#00e676);
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.summary{
margin-bottom:20px;
line-height:1.8;
}

.price{
font-size:30px;
color:#00ffc8;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>
💳 Complete Payment
</h2>

<div class="summary">

<p id="venue"></p>

<p id="game"></p>

<p id="time"></p>

<p class="price" id="price"></p>

</div>

<div class="methods">

<button
id="upiBtn"
class="active"
onclick="selectMethod('UPI')">

UPI

</button>

<button
id="cardBtn"
onclick="selectMethod('CARD')">

Card

</button>

</div>

<div class="box">

<label>
Payment Details
</label>

<input
type="text"
id="paymentInput"
placeholder="Enter UPI ID">

</div>

<button
class="pay-btn"
onclick="payNow()">

Pay Now

</button>

</div>

<script>

let method = "UPI";

function selectMethod(type){

method = type;

document
.getElementById("upiBtn")
.classList.remove("active");

document
.getElementById("cardBtn")
.classList.remove("active");

if(type === "UPI"){

document
.getElementById("upiBtn")
.classList.add("active");

document
.getElementById("paymentInput")
.placeholder =
"Enter UPI ID";

}else{

document
.getElementById("cardBtn")
.classList.add("active");

document
.getElementById("paymentInput")
.placeholder =
"Enter Card Number";
}
}

/* LOAD DATA */

document
.getElementById("venue")
.innerText =
"Venue: " + localStorage.getItem("venue");

document
.getElementById("game")
.innerText =
"Game: " + localStorage.getItem("game");

document
.getElementById("time")
.innerText =
"Time: " + localStorage.getItem("time");

document
.getElementById("price")
.innerText =
"₹" + localStorage.getItem("price");

/* PAYMENT */

function payNow(){

fetch("/save-transaction",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

venue:
localStorage.getItem("venue"),

game:
localStorage.getItem("game"),

time:
localStorage.getItem("time"),

amount:
localStorage.getItem("price"),

method:method

})

})

.then(res=>res.text())

.then(msg=>{

alert("Payment Successful!");

window.location.href =
"/success";

});

}

</script>

</body>
</html>
