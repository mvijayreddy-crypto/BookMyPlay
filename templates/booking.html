<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking</title>

<style>

    /* ================= GLOBAL RESPONSIVE ================= */

img{
    max-width:100%;
    height:auto;
}

iframe{
    max-width:100%;
}

input,
button,
select,
textarea{
    max-width:100%;
}

/* TABLET */

@media(max-width:900px){

    body{
        overflow-x:hidden;
    }

    .flex,
    .games,
    .stats{
        flex-wrap:wrap;
    }

    .card,
    .stat-card{
        width:45%;
    }

    .search,
    .weather,
    .activity,
    .slot-section,
    .map,
    .trending{
        width:94%;
    }
}

/* MOBILE */

@media(max-width:600px){

    body{
        overflow-x:hidden;
    }

    .header{
        padding:12px;
    }

    .header h2{
        font-size:20px;
    }

    .welcome{
        margin:15px;
        padding:18px;
    }

    .stats{
        flex-direction:column;
        align-items:center;
    }

    .stat-card{
        width:92%;
    }

    .games{
        justify-content:center;
        gap:15px;
    }

    .card{
        width:90%;
        max-width:250px;
    }

    .slot{
        width:90%;
        text-align:center;
    }

    .search{
        width:94%;
    }

    .flex{
        flex-direction:column;
        align-items:center;
    }

    .box{
        width:92%;
    }

    .bottom-nav{
        width:96%;
        height:70px;
    }

    .bottom-nav div{
        font-size:11px;
    }

    .quick-book{
        width:58px;
        height:58px;
    }

    .plus-icon{
        font-size:26px;
    }
}

/* SMALL MOBILE */

@media(max-width:420px){

    .header h2{
        font-size:18px;
    }

    .welcome h2{
        font-size:22px;
    }

    .card{
        width:95%;
    }

    .bottom-nav div{
        font-size:10px;
    }
}
body{
    margin:0;
    font-family:Arial;
    background:#f5f7fa;
    text-align:center;
}

/* Header */
.header{
    background:#4CAF50;
    color:white;
    padding:15px;
    font-size:20px;
}

/* Slots */
.slots{
    margin-top:30px;
}

.slot{
    display:inline-block;
    padding:12px 20px;
    margin:10px;
    background:white;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    cursor:pointer;
}

/* Button */
.book-btn{
    margin-top:30px;
    padding:15px 30px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header" id="gameTitle">Game</div>

<div class="slots" id="slots"></div>

<button class="book-btn" onclick="book()">Book Now</button>

<script>
let game = localStorage.getItem("selectedGame");
document.getElementById("gameTitle").innerText = game;

/* Sample slots */
let times = ["6 AM", "8 AM", "10 AM", "4 PM", "6 PM"];

let container = document.getElementById("slots");

times.forEach(time => {
    let div = document.createElement("div");
    div.className = "slot";
    div.innerText = time;

    div.onclick = function(){
        localStorage.setItem("time", time);
        alert("Selected: " + time);
    };

    container.appendChild(div);
});

function book(){
    let time = localStorage.getItem("time");
    if(!time){
        alert("Select time first!");
    }else{
        alert("Booking Confirmed for " + game + " at " + time);
    }
}

fetch(`/check-slots?game=${game}&date=${date}`)
.then(res => res.json())
.then(data => {
    console.log(data.booked);
});
</script>

</body>
</html>
