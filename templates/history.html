<!DOCTYPE html>
<html>
<head>
<title>My Bookings</title>

<style>
    
body{
    font-family:'Segoe UI';
    background:#eef1f5;
    margin:0;
}
.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:white;
    display:flex;
    justify-content:space-around;
    padding:10px 0;
    box-shadow:0 -5px 15px rgba(0,0,0,0.1);
}

.bottom-nav div{
    text-align:center;
    font-size:14px;
    cursor:pointer;
    color:#777;
}

.bottom-nav .active{
    color:#4CAF50;
    font-weight:bold;
}

/* Header */
.header{
    background:#4CAF50;
    color:white;
    padding:15px;
    text-align:center;
    font-size:20px;
}

/* Container */
.container{
    padding:20px;
}

/* Booking Card */
.card{
    background:white;
    padding:20px;
    margin:15px 0;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.02);
}

/* Details Modal */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;
    padding:25px;
    border-radius:15px;
    width:300px;
    text-align:center;
}

button{
    margin-top:15px;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#4CAF50;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">📊 My Bookings</div>

<div class="container" id="list"></div>

<!-- MODAL -->
<div class="modal" id="detailModal">
    <div class="modal-content">
        <h3>Booking Details</h3>
        <div id="detailBox"></div>
        <button onclick="closeModal()">Close</button>
    </div>
</div>

<script>

let bookings = JSON.parse(localStorage.getItem("bookings")) || [];
let box = document.getElementById("list");

if(bookings.length === 0){
    box.innerHTML = "<p>No bookings yet 😕</p>";
}

// CREATE CARDS
bookings.forEach((b, index) => {

    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
        <b>${b.venue}</b><br>
        Game: ${b.game} <br>
        Time: ${b.time} <br>
        Price: ${b.price}
    `;

    // 👉 CLICK TO OPEN FULL DETAILS
    div.onclick = function(){
        openDetails(b);
    };

    box.appendChild(div);
});

// OPEN DETAILS
function openDetails(b){

    document.getElementById("detailBox").innerHTML = `
        <b>Venue:</b> ${b.venue}<br><br>
        <b>Game:</b> ${b.game}<br><br>
        <b>Time:</b> ${b.time}<br><br>
        <b>Price:</b> ${b.price}<br><br>
        <b>Date:</b> ${b.date}
    `;

    document.getElementById("detailModal").style.display = "flex";
}

// CLOSE MODAL
function closeModal(){
    document.getElementById("detailModal").style.display = "none";
}
function goHome(){
    window.location.href = "/dashboard";
}

function goVenues(){
    window.location.href = "/venues";
}

function goHistory(){
    window.location.href = "/history";
}

function goProfile(){
    alert("👤 Profile page coming soon");
}

</script>
<!-- BOTTOM NAV -->
<<div class="bottom-nav">
    <div onclick="goHome()">🏠<br>Home</div>
    <div onclick="goVenues()">📍<br>Venues</div>
    <div onclick="goHistory()" class="active">📊<br>History</div>
    <div onclick="goProfile()">👤<br>Profile</div>
</div>
</body>
</html>
