<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
My Bookings - BookMyPlay
</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    overflow-x:hidden;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:
    radial-gradient(circle at top left,#16213e,#0f172a 45%,#020617 90%);
    color:white;
    overflow-x:hidden;
    padding-bottom:100px;
}

/* HEADER */

.header{
    background:
    linear-gradient(135deg,#00c853,#00e676);
    padding:22px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    border-bottom-left-radius:28px;
    border-bottom-right-radius:28px;
    box-shadow:0 0 30px rgba(0,255,128,0.3);
}

/* SEARCH */

.search-box{
    width:92%;
    max-width:700px;
    margin:22px auto;
}

.search-box input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    color:white;
    outline:none;
    font-size:15px;
    backdrop-filter:blur(10px);
}

/* FILTERS */

.filters{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:24px;
    padding:0 12px;
}

.filters button{
    padding:10px 18px;
    border:none;
    border-radius:18px;
    background:rgba(255,255,255,0.08);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.filters button:hover{
    background:#00e676;
    color:black;
}

/* CONTAINER */

.container{
    width:92%;
    max-width:950px;
    margin:auto;
}

/* BOOKING CARD */

.card{
    background:
    rgba(255,255,255,0.08);
    backdrop-filter:blur(14px);
    border-radius:26px;
    padding:22px;
    margin-bottom:22px;
    box-shadow:0 0 25px rgba(0,0,0,0.25);
    transition:0.3s;
    cursor:pointer;
}

.card:hover{
    transform:translateY(-5px);
}

/* TOP */

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

/* VENUE */

.venue{
    font-size:24px;
    font-weight:bold;
}

/* STATUS */

.status{
    padding:8px 14px;
    border-radius:14px;
    font-size:12px;
    font-weight:bold;
}

.completed{
    background:#00c853;
    color:white;
}

.upcoming{
    background:#ff9800;
    color:white;
}

/* DETAILS */

.details{
    margin-top:18px;
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));
    gap:18px;
}

.detail-box{
    background:rgba(255,255,255,0.05);
    padding:16px;
    border-radius:18px;
}

.label{
    color:#bbbbbb;
    font-size:13px;
    margin-bottom:6px;
}

.value{
    font-size:16px;
    font-weight:bold;
}

/* PRICE */

.price{
    color:#00ffc8;
    font-size:24px;
    font-weight:bold;
}

/* EMPTY */

.empty{
    text-align:center;
    margin-top:80px;
    color:#cccccc;
    font-size:18px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.75);
    justify-content:center;
    align-items:center;
    z-index:999;
    padding:18px;
}

.modal-content{
    width:100%;
    max-width:420px;
    background:
    rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    border-radius:28px;
    padding:28px;
    box-shadow:0 0 35px rgba(0,0,0,0.35);
}

.modal-content h3{
    margin-bottom:20px;
    color:#00ffc8;
    text-align:center;
}

.modal-content p{
    margin-bottom:14px;
    color:#dddddd;
}

.close-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:18px;
    background:
    linear-gradient(135deg,#00ffc8,#00e676);
    color:black;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

/* NAVIGATION */

.bottom-nav{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    width:94%;
    max-width:700px;
    height:68px;
    border-radius:22px;
    background:rgba(15,20,35,0.92);
    backdrop-filter:blur(18px);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:999;
    box-shadow:0 0 25px rgba(0,255,200,0.15);
}

.bottom-nav div{
    text-align:center;
    font-size:12px;
    cursor:pointer;
    color:#cccccc;
}

.bottom-nav .active{
    color:#00ffc8;
    font-weight:bold;
}

/* RESPONSIVE */

@media screen and (max-width:768px){

    .header{
        font-size:22px;
        padding:18px;
    }

    .venue{
        font-size:20px;
    }

    .details{
        grid-template-columns:1fr;
    }

    .card{
        padding:18px;
    }

    .bottom-nav{
        height:66px;
    }

    .bottom-nav div{
        font-size:10px;
    }
}

/* SMALL MOBILE */

@media screen and (max-width:480px){

    .header{
        font-size:18px;
    }

    .card{
        padding:16px;
        border-radius:22px;
    }

    .venue{
        font-size:18px;
    }

    .price{
        font-size:22px;
    }

    .modal-content{
        padding:22px;
    }

    .bottom-nav{
        height:64px;
    }

    .bottom-nav div{
        font-size:9px;
    }
}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">
📅 My Bookings
</div>

<!-- SEARCH -->

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search bookings...">

</div>

<!-- FILTERS -->

<div class="filters">

<button onclick="filterBookings('all')">
All
</button>

<button onclick="filterBookings('upcoming')">
Upcoming
</button>

<button onclick="filterBookings('completed')">
Completed
</button>

</div>

<!-- CONTAINER -->

<div class="container"
id="list">

</div>

<!-- MODAL -->

<div class="modal"
id="detailModal">

<div class="modal-content">

<h3>
Booking Details
</h3>

<div id="detailBox">

</div>

<button
class="close-btn"
onclick="closeModal()">

Close

</button>

</div>

</div>

<!-- NAVIGATION -->

<div class="bottom-nav">

<div onclick="goHome()">
🏠<br>Home
</div>

<div onclick="goVenues()">
📍<br>Venues
</div>

<div class="active">
📅<br>Bookings
</div>

<div onclick="goProfile()">
👤<br>Profile
</div>

</div>

<script>

/* BOOKINGS */

let bookings =
JSON.parse(
localStorage.getItem("bookings")
) || [];

let box =
document.getElementById("list");

/* EMPTY */

if(bookings.length === 0){

box.innerHTML = `

<div class="empty">

🚫 No bookings yet

</div>

`;

}

/* RENDER */

function renderBookings(data){

box.innerHTML = "";

if(data.length === 0){

box.innerHTML = `

<div class="empty">

🚫 No matching bookings

</div>

`;

return;
}

data.forEach((b,index)=>{

let status =
(index % 2 === 0)
? "Upcoming"
: "Completed";

let statusClass =
(index % 2 === 0)
? "upcoming"
: "completed";

let div =
document.createElement("div");

div.className = "card";

div.innerHTML = `

<div class="card-top">

<div class="venue">

${b.venue || "LB Stadium"}

</div>

<div class="status ${statusClass}">

${status}

</div>

</div>

<div class="details">

<div class="detail-box">

<div class="label">
Game
</div>

<div class="value">
${b.game || "Cricket"}
</div>

</div>

<div class="detail-box">

<div class="label">
Time
</div>

<div class="value">
${b.time || "07:00 AM"}
</div>

</div>

<div class="detail-box">

<div class="label">
Date
</div>

<div class="value">
${b.date || "Today"}
</div>

</div>

<div class="detail-box">

<div class="label">
Price
</div>

<div class="price">
${b.price || "₹300"}
</div>

</div>

</div>

`;

div.onclick = ()=>{

openDetails(
b,
status
);

};

box.appendChild(div);

});

}

renderBookings(bookings);

/* SEARCH */

document
.getElementById("searchInput")
.addEventListener("keyup",function(){

let value =
this.value.toLowerCase();

let filtered =
bookings.filter(b=>

(b.venue || "")
.toLowerCase()
.includes(value)

||

(b.game || "")
.toLowerCase()
.includes(value)

);

renderBookings(filtered);

});

/* FILTER */

function filterBookings(type){

if(type === "all"){

renderBookings(bookings);

return;
}

let filtered =
bookings.filter((b,index)=>{

if(type === "upcoming"){

return index % 2 === 0;

}

if(type === "completed"){

return index % 2 !== 0;

}

});

renderBookings(filtered);

}

/* DETAILS */

function openDetails(b,status){

document
.getElementById("detailBox")
.innerHTML = `

<p>
<b>Venue:</b>
${b.venue || "LB Stadium"}
</p>

<p>
<b>Game:</b>
${b.game || "Cricket"}
</p>

<p>
<b>Time:</b>
${b.time || "07:00 AM"}
</p>

<p>
<b>Date:</b>
${b.date || "Today"}
</p>

<p>
<b>Price:</b>
${b.price || "₹300"}
</p>

<p>
<b>Status:</b>
${status}
</p>

<p>
<b>Booking ID:</b>
#BMP${Math.floor(Math.random()*99999)}
</p>

`;

document
.getElementById("detailModal")
.style.display = "flex";

}

/* CLOSE */

function closeModal(){

document
.getElementById("detailModal")
.style.display = "none";

}

/* NAVIGATION */

function goHome(){

window.location.href =
"/dashboard";

}

function goVenues(){

window.location.href =
"/venues";

}

function goProfile(){

window.location.href =
"/profile";

}

</script>

</body>
</html>
